spring:
  datasource:
    url: jdbc:h2:mem:nutrimom_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS app
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  notification:
    # Base64 của 32 byte cố định — chỉ dùng cho test, không phải secret thật.
    push-token-key: bnV0cmltb20tdGVzdC1wdXNoLXRva2VuLWtleS0zMmI=
    push-enabled: true
  family:
    invitation:
      # Mặc định tắt gửi: EmailService khi chưa có SMTP sẽ log nguyên khối HTML ra log test.
      # Bài kiểm luồng gửi tự bật lại bằng @TestPropertySource.
      send-enabled: false
  calendar:
    # Không để thread nền quét DB song song với integration test; mọi kiểm thử job gọi thẳng
    # CalendarReminderJob/CalendarReminderDispatcher bằng Clock cố định.
    reminder-job-enabled: false
  security:
    issuer: nutrimom-test
    jwt-secret: nutrimom-test-jwt-secret-with-at-least-thirty-two-characters
    access-token-ttl: PT5M
    refresh-token-ttl: P1D
    # Tắt rate-limit trong integration test (test đăng nhập/OTP lặp nhiều lần cùng IP). Đơn vị RateLimitFilter
    # được kiểm bằng test riêng tự bật cấu hình.
    rate-limit:
      enabled: false
  otp:
    code-length: 6
    ttl: PT5M
    resend-cooldown: PT1S
    max-attempts: 5
    expose-debug-code: true
    hmac-secret: nutrimom-test-otp-hmac-secret-with-at-least-thirty-two-characters
  bootstrap:
    demo-user-enabled: false
    admin-user-enabled: false

springdoc:
  api-docs:
    enabled: false
