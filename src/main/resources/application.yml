spring:
  application:
    name: nutrimom-backend
  datasource:
    url: ${NUTRIMOM_DB_URL:jdbc:postgresql://localhost:5432/NutriMomDB?currentSchema=app}
    username: ${NUTRIMOM_DB_USER:postgres}
    password: ${NUTRIMOM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NutriMomHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    user: ${NUTRIMOM_FLYWAY_USER:${spring.datasource.username}}
    password: ${NUTRIMOM_FLYWAY_PASSWORD:${spring.datasource.password}}
    default-schema: app
    schemas: app
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: true
          ssl:
            trust: smtp.gmail.com
  data:
    redis:
      repositories:
        enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    redis:
      enabled: ${NUTRIMOM_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

app:
  consultation:
    video:
      enabled: ${NUTRIMOM_VIDEO_ENABLED:true}
      url: ${LIVEKIT_URL:}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}
      join-early: PT5M
      end-grace: PT5M
      token-ttl: PT5M
  auth:
    magic-link-base-url: ${MAGIC_LINK_BASE_URL:http://localhost:5173/auth/verify}
  # base-url là ORIGIN thuần, khác magic-link-base-url ở trên (vốn là một đường dẫn đầy đủ).
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    invite-path: ${APP_FRONTEND_INVITE_PATH:/family/invite}
  family:
    invitation:
      default-expiry-hours: ${NUTRIMOM_FAMILY_INVITE_EXPIRY_HOURS:48}
      # Chỉ gate kênh email. Thông báo in-app luôn được tạo, bất kể cờ này.
      email-enabled: ${NUTRIMOM_FAMILY_INVITE_EMAIL_ENABLED:true}
  mail:
    from: ${APP_MAIL_FROM:no-reply@nutrimom.vn}
  assistant:
    enabled: ${NUTRIMOM_ASSISTANT_ENABLED:true}
    api-key: ${GROQ_API_KEY:}
    model: ${NUTRIMOM_ASSISTANT_MODEL:openai/gpt-oss-20b}
    zero-data-retention-confirmed: ${GROQ_ZDR_CONFIRMED:false}
    timeout: PT35S
    daily-user-limit: ${NUTRIMOM_ASSISTANT_DAILY_USER_LIMIT:20}
    daily-global-limit: ${NUTRIMOM_ASSISTANT_DAILY_GLOBAL_LIMIT:100}
    daily-token-budget: ${NUTRIMOM_ASSISTANT_DAILY_TOKEN_BUDGET:150000}
    retention-days: ${NUTRIMOM_ASSISTANT_RETENTION_DAYS:30}
  knowledge:
    r2:
      enabled: ${R2_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  notification:
    # Key AES-256 (base64 của 32 byte) để mã hóa push token trước khi lưu — spec mục 18.
    # Sinh key mới: openssl rand -base64 32
    push-token-key: ${NUTRIMOM_PUSH_TOKEN_KEY}
    # Tắt cờ này thì không gửi push nhưng vẫn ghi thông báo vào hộp in-app.
    push-enabled: ${NUTRIMOM_PUSH_ENABLED:true}
  calendar:
    # Tắt cờ này thì không có scheduler nào được tạo (xem CalendarSchedulingConfig) — nhắc nhở vẫn
    # lưu được nhưng không có gì bắn thông báo khi tới hạn.
    reminder-job-enabled: ${NUTRIMOM_CALENDAR_JOB_ENABLED:true}
    # ISO-8601 duration. Sai định dạng thì context fail ngay lúc khởi động.
    reminder-job-interval: ${NUTRIMOM_CALENDAR_JOB_INTERVAL:PT5M}
    max-range-days: 366
    # Phải khớp ck_calendar_reminders_remind_offset của V29.
    max-remind-minutes-before: 10080
    default-timezone: Asia/Ho_Chi_Minh
    dashboard-lookahead-days: 90
    dashboard-reminder-limit: 5
    stale-after-hours: 24
  security:
    issuer: ${NUTRIMOM_JWT_ISSUER:nutrimom-api}
    jwt-secret: ${NUTRIMOM_JWT_SECRET}
    access-token-ttl: ${NUTRIMOM_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${NUTRIMOM_REFRESH_TOKEN_TTL:P30D}
    # Rate-limit (đếm trong RAM). Ngưỡng là lựa chọn vận hành — spec mục 21 không quy định số.
    rate-limit:
      enabled: ${NUTRIMOM_RATE_LIMIT_ENABLED:true}
      policies:
        login:
          capacity: 10
          window: PT1M
        otp:
          capacity: 5
          window: PT1M
        devices:
          capacity: 20
          window: PT1M
        assistant:
          capacity: 8
          window: PT1M
        invitation-create:
          capacity: 10
          window: PT1H
        invitation-token:
          capacity: 20
          window: PT1M
        default:
          capacity: 100
          window: PT1M
      routes:
        - pattern: /api/v1/auth/login
          policy: login
        - pattern: /api/v1/auth/otp/**
          policy: otp
        - pattern: /api/v1/devices
          policy: devices
        - pattern: /api/v1/assistant/conversations/*/messages
          policy: assistant
        # Pattern CỤ THỂ phải đứng trước: RateLimitFilter lấy rule khớp ĐẦU TIÊN.
        - pattern: /api/v1/family-invitations/preview
          policy: invitation-token
        - pattern: /api/v1/family-invitations/accept
          policy: invitation-token
        - pattern: /api/v1/family-invitations
          policy: invitation-create
  otp:
    code-length: 6
    ttl: ${NUTRIMOM_OTP_TTL:PT5M}
    resend-cooldown: ${NUTRIMOM_OTP_RESEND_COOLDOWN:PT45S}
    max-attempts: ${NUTRIMOM_OTP_MAX_ATTEMPTS:5}
    expose-debug-code: ${NUTRIMOM_OTP_EXPOSE_DEBUG_CODE:false}
    hmac-secret: ${NUTRIMOM_OTP_HMAC_SECRET}
  bootstrap:
    demo-user-enabled: ${NUTRIMOM_DEMO_USER_ENABLED:true}
    admin-user-enabled: ${NUTRIMOM_ADMIN_USER_ENABLED:false}
    admin-phone: ${NUTRIMOM_ADMIN_PHONE:}
    admin-password: ${NUTRIMOM_ADMIN_PASSWORD:}
    admin-display-name: ${NUTRIMOM_ADMIN_DISPLAY_NAME:NutriMom Admin}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:file:.env[.properties]
